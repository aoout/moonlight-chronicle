,'转模项不再作为单独属性行');\n// 2. 攻击力行 = effAtk\nchk(rowVal(all,'攻击力')==='22','攻击力行显示 effAtk=22（含转模）');\n// 3. 暴击率 = effCrit (5% + 240*0.12=28.8% → 33.8%)\nconst critVal=rowVal(all,'暴击率');\nchk(critVal===Math.round(G.player.effCrit*100)+'%','暴击率行显示 effCrit='+critVal);\n// 4. 移速 = effSpeed (240+10*0.15+30 = 271.5)\nchk(rowVal(all,'移速')===String(Math.round(G.player.effSpeed)),'移速行显示 effSpeed='+Math.round(G.player.effSpeed));\n// 5. 金币获取 = effGold 显示 ×倍率\nchk(rowVal(all,'金币获取')==='×'+(G.player.effGold).toFixed(1),'金币获取行显示 effGold 倍率');\n// 6. 购买后 flash：改变 effAtk 再渲染\nrenderShopPanel(G.player);   // 记录快照\nG.player.armor+=10;          // effAtk 22→28\ncomputeDerived(G.player);\nrenderShopPanel(G.player);\nconst atkRow=rows().find(r=>r.innerHTML.includes('攻击力'));\nchk(atkRow.className.includes('flash'),'转模变化后攻击力行 flash 高亮');\nchk(rowVal(rows(),'攻击力')==='28','攻击力行更新为 effAtk=28');\nconsole.log(fails===0?'=== 全部通过 ===':'=== 有 '+fails+' 项失败 ===');\n`;\nvm.runInContext(src+'\\n'+test,sandbox,{filename:'all.js'});\nSCRIPT\nnode /tmp/panel_test.js && rm -f /tmp/panel_test.js", "Bash=cd /e/test4 && node --check js/game.js && cat > /tmp/crit_test.js <<'SCRIPT'\nconst fs=require('fs');\nconst vm=require('vm');\nconst sandbox={console,Math,setTimeout,clearTimeout};\nvm.createContext(sandbox);\nconst src=['js/icons.js','js/data.js','js/game.js'].map(f=>fs.readFileSync(f,'utf8')).join('\\n');\nconst test=`\nlet fails=0;\nfunction chk(cond,msg){ console.log((cond?'PASS':'FAIL')+' '+msg); if(!cond) fails++; }\nG.width=800; G.height=600; G.keys={};\nstartRun();\nG.player.speedToCrit=0.12;   // 裂空印记：移速 12% → 暴击率\ncomputeDerived(G.player);\n// 240 移速 × 12% = 28.8 个百分点 → 0.288；基础 0.05 → 0.338\nchk(Math.abs(G.player.effCrit-0.338)<0.001,'修复后 effCrit=33.8%（实际 '+(G.player.effCrit*100).toFixed(1)+'%）');\n// 高移速也不封顶（除非真堆暴击）\nG.player.speed=400;\ncomputeDerived(G.player);\nchk(G.player.effCrit<0.9,'移速 400 + 12% 转模不再直接封顶 90%（'+(G.player.effCrit*100).toFixed(1)+'%）');\nconsole.log(fails===0?'=== 全部通过 ===':'=== 有 '+fails+' 项失败 ===');\n`;\nvm.runInContext(src+'\\n'+test,sandbox,{filename:'all.js'});\nSCRIPT\nnode /tmp/crit_test.js && rm -f /tmp/crit_test.js && curl -s -o /dev/null -w \"页面 HTTP %{http_code}\\n\" http://127.0.0.1:8000/index.html", "Bash=cd /e/test4 && cat >> css/style.css <<'EOF'\n\n/* ================= 商店 · 武器详情 / 出售 ================= */\n.sec-hint { font-size: 9px; letter-spacing: .18em; color: rgba(244,236,216,.35); font-weight: 400; margin-left: 8px; }\n.pw-item { cursor: pointer; transition: all .22s cubic-bezier(.22,1,.36,1); }\n.pw-item:hover { border-color: var(--gold); background: rgba(233,201,135,.07); transform: translateY(-1px); }\n.pw-item.active {\n  border-color: var(--gold);\n  background: rgba(233,201,135,.12);\n  box-shadow: 0 0 12px rgba(233,201,135,.22);\n}\n\n.pw-detail {\n  margin-top: 10px; padding: 13px 15px;\n  border-radius: 12px;\n  background: linear-gradient(170deg, rgba(22,26,56,.88), rgba(10,12,28,.92));\n  border: 1px solid rgba(233,201,135,.3);\n  box-shadow: inset 0 0 26px rgba(0,0,0,.42), 0 0 18px rgba(233,201,135,.06);\n  animation: cardIn .35s cubic-bezier(.22,1,.36,1) both;\n}\n.pwd-head { display: flex; align-items: center; gap: 11px; }\n.pwd-ic { font-size: 24px; color: var(--gold); display: flex; filter: drop-shadow(0 0 9px var(--gold-glow)); }\n.pwd-title { flex: 1; min-width: 0; }\n.pwd-name { font-family: var(--font-title); font-size: 14px; letter-spacing: .14em; color: var(--moon); }\n.pwd-lv { font-size: 10px; letter-spacing: .1em; color: rgba(159,214,232,.78); margin-top: 3px; }\n.pwd-close {\n  border: none; background: transparent; color: rgba(244,236,216,.45);\n  font-size: 17px; line-height: 1; cursor: pointer; padding: 4px 6px;\n  border-radius: 6px; transition: all .2s;\n}\n.pwd-close:hover { color: var(--gold); background: rgba(233,201,135,.1); }\n.pwd-formula {\n  margin-top: 11px; padding: 8px 11px; border-radius: 8px;\n  font-size: 10.5px; letter-spacing: .07em; color: var(--ice);\n  background: rgba(159,214,232,.06); border: 1px solid rgba(159,214,232,.16);\n}\n.pwd-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 16px; margin-top: 11px; }\n.pwd-stat {\n  display: flex; justify-content: space-between; align-items: baseline;\n  font-size: 11px; padding: 3px 0;\n  border-bottom: 1px dashed rgba(233,201,135,.12);\n}\n.pwd-stat span { color: rgba(244,236,216,.58); letter-spacing: .06em; }\n.pwd-stat b { color: var(--moon); font-weight: 800; }\n.pwd-sell { margin-top: 13px; text-align: center; }\n.sell-btn {\n  cursor: pointer; border: 1px solid rgba(226,84,106,.5); border-radius: 999px;\n  background: rgba(226,84,106,.1); color: #ff9dab;\n  font-family: var(--font-body); font-size: 12px; font-weight: 800; letter-spacing: .12em;\n  padding: 8px 24px; display: inline-flex; align-items: center; gap: 7px;\n  transition: all .25s cubic-bezier(.22,1,.36,1);\n}\n.sell-btn:hover { background: rgba(226,84,106,.22); border-color: #e2546a; transform: translateY(-1px); }\n.sell-btn.confirm {\n  background: #e2546a; color: #fff; border-color: #e2546a;\n  box-shadow: 0 0 20px rgba(226,84,106,.55);\n}\nEOF\necho \"CSS 已追加\"", "Bash=cd /e/test4 && node --check js/game.js && node --check js/ui.js && cat > /tmp/sell_test.js <<'SCRIPT'\nfunction makeEl(tag) {\n  const el = {\n    tagName: tag, children: [], _html: '', _text: '',\n    style: { setProperty(k,v){ this[k]=v; } }, dataset: {},\n    offsetHeight: 62,\n    classList: { _s:new Set(), add(...c){c.forEach(x=>this._s.add(x));}, remove(...c){c.forEach(x=>this._s.delete(x));}, toggle(c,f){ if(f===undefined) f=!this._s.has(c); f?this._s.add(c):this._s.delete(c); return f; }, contains(c){return this._s.has(c);} },\n    get className(){ return [...this.classList._s].join(' '); },\n    set className(v){ this.classList._s=new Set(String(v).split(/\\s+/).filter(Boolean)); },\n    get innerHTML(){ return this._html + this.children.map(c=>c.innerHTML).join(''); },\n    set innerHTML(v){ this._html=v; this.children=[]; },\n    get textContent(){ return this._text; },\n    set textContent(v){ this._text=String(v); },\n    appendChild(c){ this.children.push(c); return c; },\n    remove(){}, addEventListener(){}, onclick:null, title:'', id:'',\n    getBoundingClientRect(){ return { top:0, height:62, left:0, width:62 }; },\n    querySelector(sel){ const cls=String(sel).replace('.',''); if(!this._qs) this._qs={}; if(!this._qs[cls]){ const e=makeEl('div'); e.classList.add(cls); this._qs[cls]=e; } return this._qs[cls]; },\n  };\n  return el;\n}\nconst els={};\nglobal.document={\n  getElementById(id){ return els[id]||(els[id]=makeEl('div')); },\n  createElement(t){ return makeEl(t); },\n  querySelectorAll(){ return []; },\n};\nglobal.window={ addEventListener(){}, innerWidth:1280, innerHeight:800 };\nglobal.requestAnimationFrame=()=>{};\nconst fs=require('fs');\nconst vm=require('vm');\nconst sandbox={console,document:global.document,window:global.window,requestAnimationFrame:global.requestAnimationFrame,Math,setTimeout,clearTimeout};\nvm.createContext(sandbox);\nconst src=['js/icons.js','js/data.js','js/game.js','js/ui.js'].map(f=>fs.readFileSync(f,'utf8')).join('\\n');\nconst test=`\nlet fails=0;\nfunction chk(cond,msg){ console.log((cond?'PASS':'FAIL')+' '+msg); if(!cond) fails++; }\nG.width=800; G.height=600; G.keys={};\nstartRun();\naddWeapon('crossbow');   // 两把武器\ncomputeDerived(G.player);\nG.gold=100; G.state='shop';\nopenShop();\n// 1. 武器项可点击 + 详情生成\nconst wl=document.getElementById('shop-weapons');\nchk(wl.children.length===2,'武器列表 2 项');\nchk(wl.children[0].onclick && typeof wl.children[0].onclick==='function','武器项绑定点击');\nshowWeaponDetail('moonRing');\nconst detail=document.getElementById('pw-detail');\nchk(!detail.classList.contains('hidden'),'详情面板显示');\nchk(detail.innerHTML.includes('月辉回刃')&&detail.innerHTML.includes('Lv.1'),'详情含名称/等级');\nchk(detail.innerHTML.includes('基础伤害')&&detail.innerHTML.includes('冷却'),'详情含属性明细');\nchk(detail.innerHTML.includes('占比'),'详情含伤害占比');\nchk(detail.innerHTML.includes('出售'),'详情含出售按钮');\n// 2. 二次确认\nconst goldBefore=G.gold;\ndocument.getElementById('pwd-sell').onclick();   // 第一次 → confirm\nchk(document.getElementById('pwd-sell').className.includes('confirm'),'第一次点击进入确认态');\nchk(G.gold===goldBefore&&G.player.weapons.length===2,'确认态未执行出售');\ndocument.getElementById('pwd-sell').onclick();   // 第二次 → 执行\nchk(G.gold===goldBefore+weaponSellPrice(1),'出售后金币增加 (+'+weaponSellPrice(1)+')');\nchk(G.player.weapons.length===1,'武器已移除');\n// 3. 出售后 openShop 刷新：详情隐藏、武器列表更新\nchk(document.getElementById('shop-weapons').children.length===1,'刷新后武器列表 1 项');\n// 4. 只剩一把：不可出售\nshowWeaponDetail(G.player.weapons[0].id);\nconst g2=G.gold;\ndocument.getElementById('pwd-sell').onclick();\ndocument.getElementById('pwd-sell').onclick();\nchk(G.gold===g2&&G.player.weapons.length===1,'仅剩一把时出售被阻止');\nconsole.log(fails===0?'=== 全部通过 ===':'=== 有 '+fails+' 项失败 ===');\n`;\nvm.runInContext(src+'\\n'+test,sandbox,{filename:'all.js'});\nSCRIPT\nnode /tmp/sell_test.js && rm -f /tmp/sell_test.js", "Bash=cd /e/test4 && cat > /tmp/split_js.py <<'SCRIPT'\nimport os\nlines = open('js/game.js', encoding='utf-8').read().split('\\n')\ndef seg(a, b):  # 1-based 行区间 -> 文本\n    return '\\n'.join(lines[a-1:b]) + '\\n'\nos.makedirs('js/ui', exist_ok=True)\n\nhead_core = \"/* =========================================================\\n   蚀月远征 · 核心层：状态 / 玩家 / 属性 / 武器管理\\n   ========================================================= */\\n'use strict';\\n\"\nhead_fx   = \"/* =========================================================\\n   蚀月远征 · 特效层：粒子生成（爆点 / 火花 / 冲击环 / 星爆）\\n   ========================================================= */\\n'use strict';\\n\"\nhead_en   = \"/* =========================================================\\n   蚀月远征 · 敌人层：生成 / 行为 / 伤害结算 / 掉落\\n   ========================================================= */\\n'use strict';\\n\"\nhead_wp   = \"/* =========================================================\\n   蚀月远征 · 武器层：开火 / 投射物 / 连锁 / 环绕\\n   ========================================================= */\\n'use strict';\\n\"\nhead_re   = \"/* =========================================================\\n   蚀月远征 · 渲染层：背景 / 敌人 / 玩家 / 投射物 / 粒子\\n   ========================================================= */\\n'use strict';\\n\"\nhead_game = \"/* =========================================================\\n   蚀月远征 · 流程层：关卡 / 主循环 / 更新\\n   ========================================================= */\\n'use strict';\\n\"\n\n# game.js 拆 6 份（1-based 行）\ncore    = seg(1, 120)      # 头+G+RNG+工具+玩家+武器管理+金币经验\nfx      = seg(406, 453)    # addFx ~ shakeScreen\nenemies = seg(121, 405)    # spawnEnemy ~ collectDrop\nweapons = seg(454, 770)    # nearestEnemy ~ orbitTick\nrender  = seg(921, 1290)   # drawBackground ~ drawBossBar\ngame    = seg(771, 920) + seg(1289, 1311)  # startStage~update + playerDeath~gameLoop\n\n# 去掉 core 里的原文件头注释（保留 body 从 G 开始）\n# core 第 1-6 行是原头注释，替换\ncore = head_core + '\\n'.join(lines[5:120]) + '\\n'\n\nfiles = {\n  'js/core.js': core,\n  'js/fx.js': fx,\n  'js/enemies.js': enemies,\n  'js/weapons.js': weapons,\n  'js/render.js': render,\n  'js/game.js': game,\n}\nfor name, body in files.items():\n    # 补头注释：fx/enemies/weapons/render/game 各自替换原文件头\n    pass\n# 统一处理：fx/enemies/weapons/render/game 的首行块是原注释，直接拼接自己的头\ndef add_head(body, head):\n    # 找到第一个 'use strict' 或第一个 const/function 起始\n    idx = body.find(\"'use strict'\")\n    if idx >= 0:\n        idx = body.index('\\n', idx)\n        return head + body[idx+1:]\n    return head + body\n\nopen('js/core.js','w',encoding='utf-8').write(core)\nopen('js/fx.js','w',encoding='utf-8').write(add_head(fx, head_fx))\nopen('js/enemies.js','w',encoding='utf-8').write(add_head(enemies, head_en))\nopen('js/weapons.js','w',encoding='utf-8').write(add_head(weapons, head_wp))\nopen('js/render.js','w',encoding='utf-8').write(add_head(render, head_re))\nopen('js/game.js','w',encoding='utf-8').write(add_head(game, head_game))\nprint('game.js 拆分完成')\nfor f in ['js/core.js','js/fx.js','js/enemies.js','js/weapons.js','js/render.js','js/game.js']:\n    print(' ', f, len(open(f,encoding='utf-8').read().split('\\n')), '行')\nSCRIPT\npython /tmp/split_js.py", "Edit", "Bash=cd /d/moonlight-chronicle && (npm run dev > /tmp/vite.log 2>&1 &) && sleep 3 && cat /tmp/vite.log | head -12"]
