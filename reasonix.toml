-wave {\n  position: absolute; top: -6px; left: 0; width: 200%; height: 6px;\n  fill: var(--wcolor,#e9c987); opacity: .9;\n  animation: waveShift 2.8s linear infinite;\n}\n@keyframes waveShift { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n\n/* 冷却外环 */\n.wcd { position: absolute; inset: 3px; z-index: 3; pointer-events: none; }\n.wcd-track { fill: none; stroke: rgba(233,201,135,.16); stroke-width: 2; }\n.wcd-fill {\n  fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linecap: round;\n  transform: rotate(-90deg); transform-origin: center;\n}\n\n/* 图标/文字浮于液面之上 */\n.wslot .w-icon, .wslot .w-name, .wslot .w-lvl { position: relative; z-index: 2; }\n\n/* 占比角标 */\n.wpct {\n  position: absolute; top: 3px; right: 5px; z-index: 4;\n  font-size: 9px; font-weight: 800;\n  color: var(--gold); text-shadow: 0 1px 4px rgba(0,0,0,.9);\n  pointer-events: none;\n}\n\n/* 冷却中：槽内降饱和变暗 */\n.wslot.cool .w-icon { filter: saturate(.3) brightness(.62); }\n.wslot.cool .w-name, .wslot.cool .w-lvl { opacity: .45; }\n\n/* 冷却完成：亮起脉冲 */\n.wslot.ready-pulse { animation: cdPulse .4s ease; }\n.wslot.ready-pulse .w-icon { animation: iconPop .4s ease; }\n@keyframes cdPulse {\n  0%   { box-shadow: inset 0 0 20px rgba(0,0,0,.4); }\n  40%  { box-shadow: 0 0 24px rgba(233,201,135,.85), inset 0 0 26px rgba(233,201,135,.3); }\n  100% { box-shadow: inset 0 0 20px rgba(0,0,0,.4); }\n}\n@keyframes iconPop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }\nEOF\necho \"CSS 已追加\" && node --check js/game.js && node --check js/ui.js && echo \"JS 语法 OK\"", "Bash=cd /e/test4 && cat > /tmp/wdmg_test.js <<'SCRIPT'\nconst fs=require('fs');\nconst vm=require('vm');\nconst sandbox={console,Math,setTimeout,clearTimeout};\nvm.createContext(sandbox);\nconst src=['js/icons.js','js/data.js','js/game.js'].map(f=>fs.readFileSync(f,'utf8')).join('\\n');\nconst test=`\nlet fails=0;\nfunction chk(cond,msg){ console.log((cond?'PASS':'FAIL')+' '+msg); if(!